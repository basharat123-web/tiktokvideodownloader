<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader | No Watermark HD</title>
    <meta name="description" content="Download TikTok videos without watermark in high resolution for free. Fast and easy TikTok video downloader.">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>TikTok Save</h1>
            <p class="subtitle">High Quality • No Watermark • Free</p>
        </header>

        <main>
            <div class="input-group">
                <input type="text" id="tiktokUrl" placeholder="Paste TikTok link here..." autocomplete="off">
                <div id="errorMsg" class="error-msg">Please enter a valid TikTok URL</div>
            </div>

            <button id="downloadBtn" class="download-btn">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                <span>Get Video</span>
            </button>

            <div id="loader" class="loader"></div>

            <section id="resultArea" class="result-card">
                <div class="video-info">
                    <div class="thumbnail-container">
                        <img id="videoThumb" src="" alt="Video Thumbnail">
                    </div>
                    <div id="videoTitle" class="video-title"></div>
                    
                    <div class="download-options">
                        <a id="hdDownload" href="javascript:void(0)" class="opt-btn primary">
                            <i class="fa-solid fa-circle-down"></i> No Watermark HD
                        </a>
                        <a id="sdDownload" href="javascript:void(0)" class="opt-btn">
                            <i class="fa-solid fa-download"></i> Standard Quality
                        </a>
                        <a id="musicDownload" href="javascript:void(0)" class="opt-btn">
                            <i class="fa-solid fa-music"></i> Download MP3
                        </a>
                    </div>
                </div>
            </section>
        </main>

        <footer style="margin-top: 40px; font-size: 0.75rem; color: rgba(255,255,255,0.2);">
            <p>Paste the link and the tool will handle the rest.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
